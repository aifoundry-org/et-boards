deploy_image:
  extends:
    - .template_job
    - .pod_nano
  stage: deploy
  rules:
    - *release_job_rule
  needs:
    - flash_image_release
    - flash_image_debug
    - check_debug_vs_release_size
  variables:
    TIMEOUT: 1h
    CMD_PUSH_ARTIFACTS: |
      set -e
      ver_dir=common/Config/inc
      major=$(grep -Po '#define\s+RT_FW_VERSION_H\s+\K\d+' $${ver_dir}/version.h)
      minor=$(grep -Po '#define\s+RT_FW_VERSION_M\s+\K\d+' $${ver_dir}/version.h)
      patch=$(grep -Po '#define\s+RT_FW_VERSION_L\s+\K\d+' $${ver_dir}/version.h)
      version=$${major}.$${minor}.$${patch}
      flash_image_release_name=pmic_flash_fw_release_$${version}.bin
      flash_image_debug_name=pmic_flash_fw_debug_$${version}.bin
      artifactory_target=pmic-fw-release
      [ -s pmic_flash_image_release.bin ]
      [ -s pmic_flash_image_debug.bin ]
      mv pmic_flash_image_release.bin $${flash_image_release_name}
      mv pmic_flash_image_debug.bin $${flash_image_debug_name}
      # Generate the build name
      BUILD_NAME="EsperantoPMIC"
      # Collect environment variables
      jfrog rt bce $${BUILD_NAME} $${CI_JOB_ID}
      # Upload CI artifacts
      echo "Uploading http://sc-artifactory1.esperanto.ai/artifactory/$${artifactory_target}/$${flash_image_release_name}"
      jfrog rt u "$${flash_image_release_name}" "$${artifactory_target}" --build-name $${BUILD_NAME} --build-number $${CI_JOB_ID}
      echo "Uploading http://sc-artifactory1.esperanto.ai/artifactory/$${artifactory_target}/$${flash_image_debug_name}"
      jfrog rt u "$${flash_image_debug_name}" "$${artifactory_target}" --build-name $${BUILD_NAME} --build-number $${CI_JOB_ID}
      # Publish build info
      jfrog rt bp $${BUILD_NAME} $${CI_JOB_ID} --build-url="$${CI_SERVER_URL}"
